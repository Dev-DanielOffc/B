<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - No encontrado</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;height:100dvh;background:#ffffff;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
@media(prefers-color-scheme:dark){html,body{background:#111827;color:#f9fafb}}
.container{text-align:center;padding:24px;max-width:420px}
.code{font-size:96px;font-weight:800;color:#2563eb;line-height:1}
.title{font-size:22px;font-weight:700;margin-top:12px}
.text{font-size:15px;opacity:.7;margin-top:8px;line-height:1.5}
.btn{display:inline-block;margin-top:24px;padding:12px 24px;background:#2563eb;color:#fff;text-decoration:none;border-radius:12px;font-weight:600;font-size:15px}
.btn:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="container">
<div class="code">404</div>
<div class="title">Página no encontrada</div>
<div class="text">La ruta que buscas no existe o fue movida.</div>
<a href="/" class="btn">Volver al inicio</a>
</div>
</body>
</html>
