<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MessagesChat</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
:root {
  --bg-main: #ffffff;
  --bg-card: #ffffff;
  --bg-hover: #f3f4f6;
  --bg-search: #f2f4f7;
  --border-search: #e6e8ec;
  --text-main: #1f2937;
  --text-sub: #6b7280;
  --text-muted: #9ca3af;
  --border-color: #eeeeee;
  --border-light: #f3f4f6;
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, 0.12);
  --modal-bg: #ffffff;
  --item-selected: #eff6ff;
  --shadow-glow: rgba(0,0,0,0.15);
  --unread-dot: #ef4444;
}
@media (prefers-color-scheme: dark) {
  :root.theme-system {
    --bg-main: #111827;
    --bg-card: #1f2937;
    --bg-hover: #374151;
    --bg-search: #1f2937;
    --border-search: #374151;
    --text-main: #f9fafb;
    --text-sub: #9ca3af;
    --text-muted: #6b7280;
    --border-color: #374151;
    --border-light: #1f2937;
    --accent: #3b82f6;
    --accent-soft: rgba(59, 130, 246, 0.18);
    --modal-bg: #1f2937;
    --item-selected: #1e3a8a;
    --shadow-glow: rgba(255,255,255,0.1);
    --unread-dot: #ef4444;
  }
}
:root.theme-dark {
  --bg-main: #111827;
  --bg-card: #1f2937;
  --bg-hover: #374151;
  --bg-search: #1f2937;
  --border-search: #374151;
  --text-main: #f9fafb;
  --text-sub: #9ca3af;
  --text-muted: #6b7280;
  --border-color: #374151;
  --border-light: #1f2937;
  --accent: #3b82f6;
  --accent-soft: rgba(59, 130, 246, 0.18);
  --modal-bg: #1f2937;
  --item-selected: #1e3a8a;
  --shadow-glow: rgba(255,255,255,0.1);
  --unread-dot: #ef4444;
}
:root.theme-light {
  --bg-main: #ffffff;
  --bg-card: #ffffff;
  --bg-hover: #f3f4f6;
  --bg-search: #f2f4f7;
  --border-search: #e6e8ec;
  --text-main: #1f2937;
  --text-sub: #6b7280;
  --text-muted: #9ca3af;
  --border-color: #eeeeee;
  --border-light: #f3f4f6;
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, 0.12);
  --modal-bg: #ffffff;
  --item-selected: #eff6ff;
  --shadow-glow: rgba(0,0,0,0.15);
  --unread-dot: #ef4444;
}
html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background-color: var(--bg-main);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  transition: background-color 0.2s, color 0.2s;
}
.app-container {
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  touch-action: pan-y;
}
.top-header {
  height: 60px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: var(--bg-main);
  border-bottom: 1px solid var(--border-color);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.brand-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: 0.3px;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text-sub);
  position: relative;
}
.icon-btn {
  background: none;
  border: none;
  color: var(--text-sub);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
  border-radius: 50%;
  transition: background 0.15s ease, color 0.15s ease;
}
.icon-btn:active {
  background-color: var(--bg-hover);
  color: var(--accent);
}
.dropdown-menu {
  position: absolute;
  top: 50px;
  right: 0;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  display: none;
  flex-direction: column;
  width: 230px;
  z-index: 200;
  overflow: hidden;
  animation: fadeIn 0.15s ease;
}
.dropdown-menu.show {
  display: flex;
}
.dropdown-menu button {
  padding: 12px 14px;
  background: none;
  border: none;
  text-align: left;
  font-size: 14px;
  color: var(--text-main);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 500;
}
.dropdown-menu button:active {
  background: var(--bg-hover);
}
.dropdown-menu svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
  flex-shrink: 0;
}
.search-container {
  padding: 10px 14px 12px 14px;
  background-color: var(--bg-main);
  flex-shrink: 0;
  z-index: 10;
}
.search-box {
  background-color: var(--bg-search);
  border: 1px solid var(--border-search);
  border-radius: 24px;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text-sub);
  transition: background 0.2s, border-color 0.2s;
}
.search-box:focus-within {
  background-color: var(--bg-main);
  border-color: var(--accent);
}
.search-box svg {
  width: 18px;
  height: 18px;
  fill: var(--text-sub);
  flex-shrink: 0;
}
.search-input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-main);
  font-size: 15px;
}
.search-input::placeholder {
  color: var(--text-muted);
}
.search-input::-webkit-search-decoration,
.search-input::-webkit-search-cancel-button,
.search-input::-webkit-search-results-button,
.search-input::-webkit-search-results-decoration {
  -webkit-appearance: none;
}
.tab-content {
  flex: 1;
  overflow: hidden;
  position: relative;
  background-color: var(--bg-main);
}
.view-wrapper {
  display: flex;
  height: 100%;
  transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform;
}
.view-page {
  min-width: 100%;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  background-color: var(--bg-main);
  -webkit-overflow-scrolling: touch;
}
.view-page.active {
  display: block;
}
.chat-list {
  display: flex;
  flex-direction: column;
  background-color: var(--bg-main);
}
.chat-item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  gap: 14px;
  cursor: pointer;
  transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease;
  background-color: var(--bg-main);
  position: relative;
  touch-action: manipulation;
}
.chat-item.pressing {
  transform: scale(0.96);
}
.chat-item.selected {
  background-color: var(--item-selected);
}
.avatar-container {
  position: relative;
  width: 48px;
  height: 48px;
  flex-shrink: 0;
}
.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: linear-gradient(135deg, #002D62, #CE1126);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 18px;
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}
.unread-dot {
  position: absolute;
  top: -2px;
  right: -2px;
  width: 12px;
  height: 12px;
  background-color: var(--unread-dot);
  border-radius: 50%;
  border: 2px solid var(--bg-main);
  display: none;
}
.unread-dot.show {
  display: block;
}
.check-badge {
  position: absolute;
  bottom: -2px;
  right: -2px;
  width: 20px;
  height: 20px;
  background-color: var(--accent);
  border: 2px solid var(--bg-main);
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
}
.check-badge svg {
  width: 12px;
  height: 12px;
  fill: #ffffff;
}
.chat-item.selected .check-badge {
  display: flex;
}
.chat-details {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  border-bottom: 1px solid var(--border-light);
  padding-bottom: 12px;
  min-width: 0;
}
.chat-top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}
.chat-name-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.chat-name {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.unread-count-badge {
  font-size: 11px;
  font-weight: 600;
  color: var(--unread-dot);
  background-color: var(--accent-soft);
  padding: 1px 8px;
  border-radius: 12px;
  display: none;
  margin-left: 4px;
}
.unread-count-badge.show {
  display: inline-block;
}
.pin-icon {
  width: 14px;
  height: 14px;
  fill: var(--text-sub);
  display: none;
  flex-shrink: 0;
}
.pin-icon.show {
  display: inline-block;
}
.fav-icon {
  width: 14px;
  height: 14px;
  fill: #eab308;
  display: none;
  flex-shrink: 0;
}
.fav-icon.show {
  display: inline-block;
}
.chat-time {
  font-size: 12px;
  color: var(--accent);
  font-weight: 500;
  flex-shrink: 0;
}
.chat-bottom-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.chat-last-msg {
  font-size: 14px;
  color: var(--text-sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.unread-badge {
  background-color: var(--accent);
  color: #ffffff;
  font-size: 12px;
  font-weight: 700;
  border-radius: 50%;
  min-width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  flex-shrink: 0;
}
.unread-badge.hidden {
  display: none;
}
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 80%;
  color: var(--text-muted);
  text-align: center;
  gap: 10px;
  font-size: 14px;
}
.bottom-nav {
  height: 65px;
  background-color: var(--bg-main);
  border-top: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-around;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.bottom-nav::before {
  content: '';
  position: absolute;
  top: -10px;
  left: -10px;
  right: -10px;
  bottom: -10px;
  pointer-events: none;
  transition: box-shadow 0.4s ease;
  z-index: 1;
  border-radius: 8px;
}
.bottom-nav.shadow-left::before {
  box-shadow: inset 30px 0 30px -20px var(--shadow-glow);
}
.bottom-nav.shadow-right::before {
  box-shadow: inset -30px 0 30px -20px var(--shadow-glow);
}
.bottom-nav.shadow-both::before {
  box-shadow: inset 30px 0 30px -20px var(--shadow-glow), inset -30px 0 30px -20px var(--shadow-glow);
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: none;
  border: none;
  color: var(--text-sub);
  cursor: pointer;
  flex: 1;
  position: relative;
  z-index: 2;
  transition: color 0.3s ease;
}
.nav-item .icon-wrap {
  padding: 4px 16px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.nav-item.active .icon-wrap {
  background-color: var(--accent-soft);
  color: var(--accent);
  transform: scale(1.05);
}
.nav-item.active span {
  color: var(--accent);
  font-weight: 600;
}
.nav-item span {
  font-size: 11px;
  transition: color 0.3s ease;
}
.nav-item svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
  transition: transform 0.3s ease;
}
.nav-item.active svg {
  transform: scale(1.1);
}
.fab {
  position: fixed;
  right: 16px;
  bottom: 81px;
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background-color: var(--accent);
  color: #ffffff;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
  cursor: pointer;
  z-index: 50;
  transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.fab:active {
  transform: scale(0.92);
  box-shadow: 0 3px 12px rgba(37, 99, 235, 0.5);
}
.fab svg {
  width: 26px;
  height: 26px;
  fill: currentColor;
}
.fab-tooltip {
  position: fixed;
  right: 16px;
  bottom: 145px;
  background-color: rgba(0, 0, 0, 0.85);
  color: #ffffff;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transform: translateY(6px);
  transition: opacity 0.2s, transform 0.2s;
  z-index: 51;
  white-space: nowrap;
}
.fab-tooltip.show {
  opacity: 1;
  transform: translateY(0);
}
.settings-overlay,
.new-chat-overlay,
.chat-open-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100dvh;
  background-color: var(--bg-main);
  z-index: 500;
  display: none;
  flex-direction: column;
  animation: slideIn 0.25s ease-out;
}
.settings-overlay.show,
.new-chat-overlay.show,
.chat-open-overlay.show {
  display: flex;
}
.settings-overlay .top-header,
.new-chat-overlay .top-header,
.chat-open-overlay .top-header {
  gap: 16px;
  justify-content: flex-start;
}
.settings-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px 0;
}
.setting-item {
  display: flex;
  align-items: center;
  padding: 16px 20px;
  gap: 16px;
  cursor: pointer;
  border-bottom: 1px solid var(--border-color);
  transition: background 0.15s;
}
.setting-item:active {
  background-color: var(--bg-hover);
}
.setting-icon {
  width: 24px;
  height: 24px;
  fill: var(--text-sub);
  flex-shrink: 0;
}
.setting-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.setting-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-main);
}
.setting-sub {
  font-size: 13px;
  color: var(--text-sub);
}
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100dvh;
  background-color: rgba(0, 0, 0, 0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.modal-overlay.show {
  display: flex;
}
.modal-card {
  width: 100%;
  max-width: 320px;
  background-color: var(--modal-bg);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  gap: 16px;
  animation: modalPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.modal-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-main);
}
.theme-options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.theme-option {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  font-size: 15px;
  color: var(--text-main);
}
.theme-option input[type="radio"] {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 8px;
}
.btn-close {
  background: none;
  border: none;
  color: var(--accent);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  padding: 8px 16px;
  border-radius: 8px;
  transition: background 0.15s;
}
.btn-close:active {
  background-color: var(--bg-hover);
}
.storage-detail {
  font-size: 14px;
  color: var(--text-sub);
  line-height: 1.5;
}
.storage-highlight {
  font-size: 24px;
  font-weight: 700;
  color: var(--accent);
  margin-top: 6px;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes slideIn {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}
@keyframes modalPop {
  0% { transform: scale(0.9); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>

<div class="app-container" id="appContainer">
  
  <div class="top-header">
    <div class="brand-title">MessagesChat</div>
    <div class="header-actions">
      <button class="icon-btn" title="Ajustes" onclick="openSettingsView()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>

      <button class="icon-btn" id="threeDotsBtn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 7a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
      </button>

      <div class="dropdown-menu" id="dropdownMenu"></div>
    </div>
  </div>

  <div class="search-container">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input 
        type="search" 
        class="search-input" 
        id="searchInput" 
        placeholder="Buscar chat..." 
        autocomplete="off" 
        autocorrect="off" 
        autocapitalize="off" 
        spellcheck="false" 
        name="search_query"
      >
    </div>
  </div>

  <div class="tab-content" id="tabContent">
    <div class="view-wrapper" id="viewWrapper">
      <div class="view-page active" id="page-chats" data-index="0">
        <div class="chat-list" id="chatList"></div>
        <div class="empty-state" id="chatsEmptyState">
          <p>No tienes chats aún</p>
          <p style="font-size:12px">Toca el botón + para empezar</p>
        </div>
      </div>

      <div class="view-page" id="page-unread" data-index="1">
        <div class="empty-state" id="unreadEmptyState">
          <p>No tienes mensajes sin leer</p>

<script>
const state = {
  user: null,
  session: null,
  chats: {},
  contacts: {},
  settings: { theme: 'system' },
  currentTab: 0,
  ws: null,
  wsReconnectTimer: null,
  fileHandle: null,
  hasFileSystem: false,
  settingsLoaded: false,
  newChatLoaded: false,
  chatOpenLoaded: false
};

const tabs = ['chats', 'unread', 'favorites'];
let isTransitioning = false;

function applyTheme(theme) {
  document.documentElement.classList.remove('theme-system', 'theme-light', 'theme-dark');
  document.documentElement.classList.add('theme-' + theme);
}

function initTheme() {
  applyTheme(state.settings.theme || 'system');
}

async function loadLocal(filename, fallback = null) {
  if (state.hasFileSystem && state.fileHandle) {
    try {
      const fileHandle = await state.fileHandle.getFileHandle(filename, { create: true });
      const file = await fileHandle.getFile();
      const text = await file.text();
      if (!text) return fallback;
      return JSON.parse(text);
    } catch (err) {
      return fallback;
    }
  }
  try {
    const raw = localStorage.getItem('mc_' + filename);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (err) {
    return fallback;
  }
}

async function saveLocal(filename, data) {
  const text = JSON.stringify(data, null, 2);
  if (state.hasFileSystem && state.fileHandle) {
    try {
      const fileHandle = await state.fileHandle.getFileHandle(filename, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(text);
      await writable.close();
      return true;
    } catch (err) {
      return false;
    }
  }
  try {
    localStorage.setItem('mc_' + filename, text);
    return true;
  } catch (err) {
    return false;
  }
}

function getDeviceFingerprint() {
  const parts = [
    navigator.userAgent || '',
    navigator.platform || '',
    navigator.language || '',
    screen.width + 'x' + screen.height,
    Intl.DateTimeFormat().resolvedOptions().timeZone || ''
  ];
  return parts.join('|');
}

async function sha256Hex(text) {
  const enc = new TextEncoder();
  const data = enc.encode(text);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function verifySession() {
  const session = await loadLocal('session.json', null);
  if (!session || !session.token) return false;

  const fp = await sha256Hex(getDeviceFingerprint());
  if (session.device_fingerprint && session.device_fingerprint !== fp) return false;

  try {
    const res = await fetch('/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + session.token }
    });
    if (!res.ok) return false;
    const data = await res.json();
    state.user = data.user;
    state.session = session;
    return true;
  } catch (err) {
    return false;
  }
}

async function api(path, options = {}) {
  const headers = options.headers || {};
  headers['Content-Type'] = headers['Content-Type'] || 'application/json';
  if (state.session && state.session.token) {
    headers['Authorization'] = 'Bearer ' + state.session.token;
  }
  const res = await fetch('/api' + path, { ...options, headers });
  if (res.status === 401) {
    await logoutAndRedirect();
    throw new Error('Unauthorized');
  }
  return res;
}

async function logoutAndRedirect() {
  try { await saveLocal('session.json', {}); } catch (e) {}
  window.location.href = '/';
}

function getDisplayName(mcid) {
  const contact = state.contacts[mcid];
  if (contact && contact.alias) return contact.alias;
  const chat = state.chats[mcid];
  if (chat && chat.virtual_number) return chat.virtual_number;
  return mcid.split('@')[0];
}

function getInitials(name) {
  if (!name) return '?';
  return name.trim().charAt(0).toUpperCase();
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  if (isToday) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  const diffDays = Math.floor((now - d) / 86400000);
  if (diffDays < 7) {
    const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    return days[d.getDay()];
  }
  return d.toLocaleDateString([], { day: '2-digit', month: '2-digit' });
}

function buildChatItem(mcid) {
  const chat = state.chats[mcid];
  const contact = state.contacts[mcid] || {};
  const name = getDisplayName(mcid);
  const item = document.createElement('div');
  item.className = 'chat-item';
  item.setAttribute('data-mcid', mcid);
  if (contact.isSelected) item.classList.add('selected');

  const avatarHtml = chat.avatar_url
    ? `<img src="${chat.avatar_url}" alt="">`
    : getInitials(name);

  item.innerHTML = `
    <div class="avatar-container">
      <div class="avatar">${avatarHtml}<span class="unread-dot ${contact.isUnread ? 'show' : ''}"></span></div>
      <div class="check-badge"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
    </div>
    <div class="chat-details">
      <div class="chat-top-row">
        <div class="chat-name-wrap">
          <span class="chat-name">${escapeHtml(name)}</span>
          <span class="unread-count-badge ${contact.isUnread ? 'show' : ''}">${chat.unread_count || 0}</span>
          <svg class="pin-icon ${contact.isPinned ? 'show' : ''}" viewBox="0 0 24 24"><path d="M16 9V4l1 0V2H7v2l1 0v5L6 11v2h5v7l1 1 1-1v-7h5v-2l-2-2z"/></svg>
          <svg class="fav-icon ${contact.isFavorite ? 'show' : ''}" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </div>
        <span class="chat-time">${formatTime(chat.last_message_at)}</span>
      </div>
      <div class="chat-bottom-row">
        <span class="chat-last-msg">${escapeHtml(chat.last_message || '')}</span>
        <span class="unread-badge ${contact.isUnread ? '' : 'hidden'}">${chat.unread_count || 1}</span>
      </div>
    </div>
  `;
  attachEventsToNode(item);
  return item;
}

function escapeHtml(text) {
  if (!text) return '';
  return String(text).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderChats() {
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  const sorted = Object.keys(state.chats).sort((a, b) => {
    const ca = state.contacts[a] || {};
    const cb = state.contacts[b] || {};
    if (ca.isPinned && !cb.isPinned) return -1;
    if (!ca.isPinned && cb.isPinned) return 1;
    return (state.chats[b].last_message_at || 0) - (state.chats[a].last_message_at || 0);
  });

  if (sorted.length === 0) {
    document.getElementById('chatsEmptyState').style.display = 'flex';
  } else {
    document.getElementById('chatsEmptyState').style.display = 'none';
    for (const mcid of sorted) {
      list.appendChild(buildChatItem(mcid));
    }
  }
  renderUnreadTab();
  renderFavoritesTab();
  updateSelectedState();
}

function renderUnreadTab() {
  const list = document.getElementById('unreadChatList');
  const empty = document.getElementById('unreadEmptyState');
  list.innerHTML = '';
  const unread = Object.keys(state.chats).filter(m => (state.contacts[m] || {}).isUnread);
  if (unread.length === 0) {
    empty.style.display = 'flex';
    list.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  list.style.display = 'flex';
  for (const mcid of unread) {
    list.appendChild(buildChatItem(mcid));
  }
}

function renderFavoritesTab() {
  const list = document.getElementById('favChatList');
  const empty = document.getElementById('favEmptyState');
  list.innerHTML = '';
  const favs = Object.keys(state.chats).filter(m => (state.contacts[m] || {}).isFavorite);
  if (favs.length === 0) {
    empty.style.display = 'flex';
    list.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  list.style.display = 'flex';
  for (const mcid of favs) {
    list.appendChild(buildChatItem(mcid));
  }
}

function updateSelectedState() {
  const selected = Object.values(state.contacts).filter(c => c.isSelected);
  const btn = document.getElementById('threeDotsBtn');
  const menu = document.getElementById('dropdownMenu');
  if (selected.length > 0) {
    btn.style.display = 'flex';
  } else {
    btn.style.display = 'none';
    menu.classList.remove('show');
  }
}

let pressTimer = null;
let isLongPress = false;
let pressStartX = 0;
let pressStartY = 0;
let hasMoved = false;

function attachEventsToNode(element) {
  const startPress = (e) => {
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    pressStartX = clientX;
    pressStartY = clientY;
    hasMoved = false;
    element.classList.add('pressing');
    isLongPress = false;

    pressTimer = setTimeout(() => {
      isLongPress = true;
      element.classList.remove('pressing');
      const mcid = element.getAttribute('data-mcid');
      if (mcid && state.contacts[mcid]) {
        state.contacts[mcid].isSelected = !state.contacts[mcid].isSelected;
        saveLocal('contacts.json', state.contacts);
        renderChats();
        buildDropdownMenu();
      }
    }, 450);
  };

  const movePress = (e) => {
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    if (Math.abs(clientX - pressStartX) > 10 || Math.abs(clientY - pressStartY) > 10) {
      hasMoved = true;
      element.classList.remove('pressing');
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    }
  };

  const cancelPress = () => {
    element.classList.remove('pressing');
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  };

  const endPress = () => {
    cancelPress();
    if (!isLongPress && !hasMoved) handleChatClick(element);
    isLongPress = false;
    hasMoved = false;
  };

  element.addEventListener('touchstart', startPress, { passive: true });
  element.addEventListener('touchmove', movePress, { passive: true });
  element.addEventListener('touchend', endPress, { passive: true });
  element.addEventListener('touchcancel', cancelPress, { passive: true });
  element.addEventListener('mousedown', startPress);
  element.addEventListener('mousemove', movePress);
  element.addEventListener('mouseup', endPress);
  element.addEventListener('mouseleave', cancelPress);
}

function handleChatClick(element) {
  const mcid = element.getAttribute('data-mcid');
  if (!mcid) return;

  const contact = state.contacts[mcid];
  if (contact && contact.isSelected) {
    contact.isSelected = false;
    saveLocal('contacts.json', state.contacts);
    renderChats();
    return;
  }

  const selectedCount = Object.values(state.contacts).filter(c => c.isSelected).length;
  if (selectedCount > 0) {
    if (contact) contact.isSelected = !contact.isSelected;
    saveLocal('contacts.json', state.contacts);
    renderChats();
    return;
  }

  if (contact) contact.isUnread = false;
  saveLocal('contacts.json', state.contacts);
  renderChats();
  openChatView(mcid);
}

async function openChatView(mcid) {
  const name = getDisplayName(mcid);
  const overlay = document.getElementById('chatOpenOverlay');
  const content = document.getElementById('chatOpenContent');
  document.getElementById('chatOpenTitle').textContent = name;
  overlay.classList.add('show');
  history.pushState({ view: 'chat', mcid }, '', '/chat/' + encodeURIComponent(mcid));

  if (!state.chatOpenLoaded) {
    content.innerHTML = '<div class="empty-state"><p>Cargando...</p></div>';
    try {
      const res = await fetch('/chat?mcid=' + encodeURIComponent(mcid), { headers: { 'X-Requested-With': 'fetch' } });
      const html = await res.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const body = doc.querySelector('.chat') || doc.body;
      content.innerHTML = body.innerHTML;

      const scripts = doc.querySelectorAll('script');
      for (const oldScript of scripts) {
        const newScript = document.createElement('script');
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        document.body.appendChild(newScript);
      }
      state.chatOpenLoaded = true;
    } catch (err) {
      content.innerHTML = '<div class="empty-state"><p>Error cargando chat</p></div>';
    }
  }
}

function closeChatView(skipHistory) {
  document.getElementById('chatOpenOverlay').classList.remove('show');
  state.chatOpenLoaded = false;
  if (!skipHistory && window.location.pathname.startsWith('/chat/')) {
    history.pushState({ view: 'home' }, '', '/main');
  }
}

function buildDropdownMenu() {
  const menu = document.getElementById('dropdownMenu');
  menu.innerHTML = '';
  const selected = Object.values(state.contacts).filter(c => c.isSelected);
  if (selected.length === 0) {
    menu.classList.remove('show');
    return;
  }
  const allFav = selected.every(c => c.isFavorite);
  const allPinned = selected.every(c => c.isPinned);
  const allUnread = selected.every(c => c.isUnread);
  const pinText = allPinned ? 'Desfijar' : 'Fijar';
  const favText = allFav ? 'Quitar de favoritos' : 'Añadir a favoritos';
  const unreadText = allUnread ? 'Marcar como leído' : 'Marcar como no leído';

  menu.innerHTML = `
    <button onclick="togglePin()"><svg viewBox="0 0 24 24"><path d="M16 9V4l1 0V2H7v2l1 0v5L6 11v2h5v7l1 1 1-1v-7h5v-2l-2-2z"/></svg>${pinText}</button>
    <button onclick="toggleFavorite()"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>${favText}</button>
    <button onclick="toggleUnread()"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>${unreadText}</button>
  `;
}

async function togglePin() {
  const selected = Object.values(state.contacts).filter(c => c.isSelected);
  const allPinned = selected.every(c => c.isPinned);
  selected.forEach(c => { c.isPinned = !allPinned; c.isSelected = false; });
  await saveLocal('contacts.json', state.contacts);
  renderChats();
  document.getElementById('dropdownMenu').classList.remove('show');
}

async function toggleFavorite() {
  const selected = Object.values(state.contacts).filter(c => c.isSelected);
  const allFav = selected.every(c => c.isFavorite);
  selected.forEach(c => { c.isFavorite = !allFav; c.isSelected = false; });
  await saveLocal('contacts.json', state.contacts);
  renderChats();
  document.getElementById('dropdownMenu').classList.remove('show');
}

async function toggleUnread() {
  const selected = Object.values(state.contacts).filter(c => c.isSelected);
  const allUnread = selected.every(c => c.isUnread);
  selected.forEach(c => { c.isUnread = !allUnread; c.isSelected = false; });
  await saveLocal('contacts.json', state.contacts);
  renderChats();
  document.getElementById('dropdownMenu').classList.remove('show');
}

function switchTab(index) {
  if (isTransitioning || index === state.currentTab) return;
  isTransitioning = true;
  state.currentTab = index;
  const width = document.getElementById('tabContent').clientWidth;
  document.getElementById('viewWrapper').style.transform = `translateX(-${index * width}px)`;
  document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
  const targetBtn = document.querySelector(`.nav-item[data-index="${index}"]`);
  if (targetBtn) targetBtn.classList.add('active');
  document.querySelectorAll('.view-page').forEach(p => p.classList.remove('active'));
  const targetPage = document.querySelector(`.view-page[data-index="${index}"]`);
  if (targetPage) targetPage.classList.add('active');
  updateShadow(index);
  setTimeout(() => { isTransitioning = false; }, 150);
}

function updateShadow(index) {
  const nav = document.getElementById('bottomNav');
  nav.classList.remove('shadow-left', 'shadow-right', 'shadow-both');
  if (index === 0) nav.classList.add('shadow-right');
  else if (index === tabs.length - 1) nav.classList.add('shadow-left');
  else nav.classList.add('shadow-both');
}

function filterChats() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const items = document.querySelectorAll('#chatList .chat-item');
  let visible = 0;
  items.forEach(item => {
    const mcid = item.getAttribute('data-mcid');
    const name = getDisplayName(mcid).toLowerCase();
    if (!query || name.includes(query)) {
      item.style.display = 'flex';
      visible++;
    } else {
      item.style.display = 'none';
    }
  });
  const empty = document.getElementById('chatsEmptyState');
  if (query && visible === 0) {
    empty.style.display = 'flex';
    empty.querySelector('p').textContent = 'No se encontraron chats';
  } else if (visible === 0) {
    empty.style.display = 'flex';
    empty.querySelector('p').textContent = 'No tienes chats aún';
  } else {
    empty.style.display = 'none';
  }
}

async function openSettingsView(skipHistory) {
  const overlay = document.getElementById('settingsOverlay');
  const content = document.getElementById('settingsContent');

  if (!state.settingsLoaded) {
    content.innerHTML = '<div class="empty-state"><p>Cargando...</p></div>';
    try {
      const res = await fetch('/ajustes', { headers: { 'X-Requested-With': 'fetch' } });
      const html = await res.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const container = doc.querySelector('.settings-container') || doc.body;
      content.innerHTML = container.innerHTML;

      const scripts = doc.querySelectorAll('script');
      for (const oldScript of scripts) {
        const newScript = document.createElement('script');
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        document.body.appendChild(newScript);
      }
      state.settingsLoaded = true;
    } catch (err) {
      content.innerHTML = '<div class="empty-state"><p>Error cargando ajustes</p></div>';
    }
  }

  overlay.classList.add('show');
  if (!skipHistory) history.pushState({ view: 'settings' }, '', '/ajustes');
}

function closeSettingsView(skipHistory) {
  document.getElementById('settingsOverlay').classList.remove('show');
  if (!skipHistory && window.location.pathname.startsWith('/ajustes')) {
    history.pushState({ view: 'home' }, '', '/main');
  }
}

async function openNewChatView(skipHistory) {
  const overlay = document.getElementById('newChatOverlay');
  const list = document.getElementById('newChatList');
  overlay.classList.add('show');
  if (!skipHistory) history.pushState({ view: 'new-chat' }, '', '/new-chat');

  if (!state.newChatLoaded) {
    list.innerHTML = '<div class="empty-state"><p>Cargando contactos...</p></div>';
    try {
      const res = await fetch('/new-chat', { headers: { 'X-Requested-With': 'fetch' } });
      const html = await res.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const container = doc.querySelector('.new-chat-container') || doc.body;
      list.innerHTML = container.innerHTML;

      const scripts = doc.querySelectorAll('script');
      for (const oldScript of scripts) {
        const newScript = document.createElement('script');
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        document.body.appendChild(newScript);
      }
      state.newChatLoaded = true;
    } catch (err) {
      list.innerHTML = '<div class="empty-state"><p>Error cargando contactos</p></div>';
    }
  }
}

function closeNewChatView(skipHistory) {
  document.getElementById('newChatOverlay').classList.remove('show');
  state.newChatLoaded = false;
  if (!skipHistory && window.location.pathname === '/new-chat') {
    history.pushState({ view: 'home' }, '', '/main');
  }
}

async function loadChats() {
  try {
    const res = await api('/chat');
    const data = await res.json();
    const chats = data.chats || [];
    state.chats = {};
    for (const c of chats) {
      const mcid = c.other_user ? c.other_user.mcid : null;
      if (!mcid) continue;
      state.chats[mcid] = {
        mcid,
        virtual_number: c.other_user.virtual_number,
        display_name: c.other_user.display_name,
        avatar_url: c.other_user.avatar_url,
        last_message: c.last_message || '',
        last_message_at: c.last_message_at,
        unread_count: c.unread_count || 0
      };
      if (!state.contacts[mcid]) {
        state.contacts[mcid] = {
          alias: null,
          isFavorite: false,
          isPinned: false,
          isUnread: false,
          isSelected: false
        };
      }
    }
    await saveLocal('contacts.json', state.contacts);
    renderChats();
  } catch (err) {
    console.error('Error cargando chats', err);
  }
}

function connectWebSocket() {
  if (!state.session || !state.session.token) return;
  if (state.ws && state.ws.readyState === WebSocket.OPEN) return;

  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${protocol}//${window.location.host}/ws?token=${encodeURIComponent(state.session.token)}`;

  try {
    state.ws = new WebSocket(url);
  } catch (err) {
    scheduleReconnect();
    return;
  }

  state.ws.onopen = () => {
    if (state.wsReconnectTimer) {
      clearTimeout(state.wsReconnectTimer);
      state.wsReconnectTimer = null;
    }
  };

  state.ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch (e) { return; }
    handleWsMessage(msg);
  };

  state.ws.onclose = () => {
    scheduleReconnect();
  };

  state.ws.onerror = () => {
    try { state.ws.close(); } catch (e) {}
  };
}

function scheduleReconnect() {
  if (state.wsReconnectTimer) return;
  state.wsReconnectTimer = setTimeout(() => {
    state.wsReconnectTimer = null;
    connectWebSocket();
  }, 5000);
}

function handleWsMessage(msg) {
  if (msg.type === 'message') {
    const fromMcid = msg.from;
    if (!state.chats[fromMcid]) {
      state.chats[fromMcid] = {
        mcid: fromMcid,
        last_message: '',
        last_message_at: msg.created_at,
        unread_count: 0
      };
      if (!state.contacts[fromMcid]) {
        state.contacts[fromMcid] = {
          alias: null,
          isFavorite: false,
          isPinned: false,
          isUnread: true,
          isSelected: false
        };
      }
    }
    state.chats[fromMcid].last_message_at = msg.created_at;
    state.chats[fromMcid].last_message = '(nuevo mensaje)';
    state.chats[fromMcid].unread_count = (state.chats[fromMcid].unread_count || 0) + 1;
    if (state.contacts[fromMcid]) state.contacts[fromMcid].isUnread = true;
    saveLocal('contacts.json', state.contacts);
    updateChatInPlace(fromMcid);
  }
}

function updateChatInPlace(mcid) {
  const existing = document.querySelector(`#chatList .chat-item[data-mcid="${mcid}"]`);
  if (existing) {
    const newItem = buildChatItem(mcid);
    existing.replaceWith(newItem);
  } else {
    renderChats();
    return;
  }
  renderUnreadTab();
  renderFavoritesTab();
  updateSelectedState();
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const idx = parseInt(btn.getAttribute('data-index'), 10);
    switchTab(idx);
  });
});

document.getElementById('threeDotsBtn').onclick = (e) => {
  e.stopPropagation();
  const menu = document.getElementById('dropdownMenu');
  if (Object.values(state.contacts).filter(c => c.isSelected).length === 0) {
    menu.classList.remove('show');
    return;
  }
  buildDropdownMenu();
  menu.classList.toggle('show');
};

document.getElementById('fabBtn').onclick = (e) => {
  e.stopPropagation();
  const tooltip = document.getElementById('fabTooltip');
  tooltip.classList.add('show');
  clearTimeout(tooltip._hideTimer);
  tooltip._hideTimer = setTimeout(() => {
    tooltip.classList.remove('show');
  }, 3000);
  setTimeout(() => openNewChatView(), 250);
};

document.getElementById('searchInput').addEventListener('input', filterChats);

document.querySelectorAll('.modal-overlay').forEach(modal => {
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.classList.remove('show');
  });
});

document.addEventListener('click', (e) => {
  const menu = document.getElementById('dropdownMenu');
  if (!menu.contains(e.target) && e.target.id !== 'threeDotsBtn') {
    menu.classList.remove('show');
  }
});

window.addEventListener('popstate', () => {
  const path = window.location.pathname;
  if (path.startsWith('/chat/')) {
    const mcid = decodeURIComponent(path.replace('/chat/', ''));
    document.getElementById('chatOpenOverlay').classList.add('show');
    document.getElementById('chatOpenTitle').textContent = getDisplayName(mcid);
  } else {
    document.getElementById('chatOpenOverlay').classList.remove('show');
    state.chatOpenLoaded = false;
  }
  if (path.startsWith('/ajustes/almacenamiento')) {
    openSettingsView(true);
  } else if (path.startsWith('/ajustes/diseno')) {
    openSettingsView(true);
  } else if (path === '/ajustes') {
    openSettingsView(true);
  } else {
    closeSettingsView(true);
  }
  if (path === '/new-chat') {
    openNewChatView(true);
  } else {
    closeNewChatView(true);
  }
});

function initSwipeNavigation() {
  const tabContent = document.getElementById('tabContent');
  const viewWrapper = document.getElementById('viewWrapper');
  let startX = 0, startY = 0, isDragging = false, dragOffset = 0;

  function width() { return tabContent.clientWidth; }

  tabContent.addEventListener('touchstart', (e) => {
    if (isTransitioning) return;
    const t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    isDragging = false;
    dragOffset = 0;
    viewWrapper.style.transition = 'none';
  }, { passive: true });

  tabContent.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
      isDragging = true;
      e.preventDefault();
      const offset = -state.currentTab * width() + dx;
      viewWrapper.style.transform = `translateX(${offset}px)`;
      dragOffset = dx;
    }
  }, { passive: false });

  tabContent.addEventListener('touchend', () => {
    if (!isDragging) {
      viewWrapper.style.transition = 'transform 0.15s cubic-bezier(0.4, 0, 0.2, 1)';
      return;
    }
    const threshold = width() * 0.15;
    let newIndex = state.currentTab;
    if (dragOffset < -threshold && state.currentTab < tabs.length - 1) newIndex++;
    else if (dragOffset > threshold && state.currentTab > 0) newIndex--;
    viewWrapper.style.transition = 'transform 0.15s cubic-bezier(0.4, 0, 0.2, 1)';
    if (newIndex !== state.currentTab) switchTab(newIndex);
    else viewWrapper.style.transform = `translateX(-${state.currentTab * width()}px)`;
    isDragging = false;
    dragOffset = 0;
  }, { passive: true });

  window.addEventListener('resize', () => {
    viewWrapper.style.transition = 'none';
    viewWrapper.style.transform = `translateX(-${state.currentTab * width()}px)`;
    setTimeout(() => {
      viewWrapper.style.transition = 'transform 0.15s cubic-bezier(0.4, 0, 0.2, 1)';
    }, 50);
  });
}

function initTabPositions() {
  const width = document.getElementById('tabContent').clientWidth;
  document.getElementById('viewWrapper').style.transform = `translateX(-${state.currentTab * width}px)`;
  updateShadow(state.currentTab);
}

async function boot() {
  const fp = await sha256Hex(getDeviceFingerprint());
  const session = await loadLocal('session.json', null);

  if (session && session.device_fingerprint && session.device_fingerprint !== fp) {
    await logoutAndRedirect();
    return;
  }

  const valid = await verifySession();
  if (!valid) {
    window.location.href = '/';
    return;
  }

  state.contacts = await loadLocal('contacts.json', {});
  state.settings = await loadLocal('settings.json', { theme: 'system' });
  initTheme();

  await loadChats();
  connectWebSocket();
  initSwipeNavigation();
  initTabPositions();
}

boot();

window.addEventListener('storage', (e) => {
  if (e.key === 'mc_settings.json') {
    try {
      const s = JSON.parse(e.newValue);
      if (s && s.theme) applyTheme(s.theme);
    } catch (err) {}
  }
});
